# pinyin-ime fcitx5 addon 配置文件
# 将此文件复制到 ~/.config/fcitx5/conf/pinyinime.conf 后修改
# 修改后可在 fcitx5 配置界面重新加载，或重启 fcitx5

# 候选词数量（解码器内部保留的候选数，越大越准但越慢）
NBest=45

# 每页显示候选数
PageSize=9

# libime 数据目录（含 zh_CN.lm 和 sc.dict）
DataDir=/usr/share/libime

# 用户数据目录（自学习历史、用户词库）
UserDataDir=~/.local/share/pinyin-ime

# 模糊音（平翘舌/前后鼻音/n-l 等）
# 总开关（v0.9.101+）：开=启用下方勾选的对；默认全关
EnableFuzzy=False

# 分对独立模糊音开关（仅 EnableFuzzy=True 生效；只开常用几对更准）
FuzzyZ_ZH=False      # z <-> zh
FuzzyC_CH=False      # c <-> ch
FuzzyS_SH=False      # s <-> sh
FuzzyL_N=False       # l <-> n
FuzzyL_R=False       # l <-> r
FuzzyF_H=False       # f <-> h
FuzzyAN_ANG=False    # an <-> ang
FuzzyEN_ENG=False    # en <-> eng
FuzzyIN_ING=False    # in <-> ing
FuzzyIAN_IANG=False  # ian <-> iang
FuzzyU_OU=False      # u <-> ou
FuzzyUAN_UANG=False  # uan <-> uang
FuzzyV_U=False       # v <-> u
FuzzyVE_UE=False     # ve <-> ue

# M3 拼写纠错
EnableCorrect=False

# 双拼（双拼输入模式）
EnableShuangpin=False

# 双拼方案（仅 EnableShuangpin=True 时生效）
# 可选：xiaohe(小鹤) / ziranma(自然码) / ms(微软) / ziguang(紫光)
#       abc(智能ABC) / zhongwenzhixing(中文之星) / pinyinjiajia(拼音加加) / gb(国标)
ShuangpinScheme=xiaohe
