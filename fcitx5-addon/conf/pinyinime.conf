# pinyin-ime fcitx5 addon 配置文件
# 将此文件复制到 ~/.config/fcitx5/conf/pinyinime.conf 后修改
# 修改后可在 fcitx5 配置界面重新加载，或重启 fcitx5

# 候选词数量（解码器内部保留的候选数，越大越准但越慢）
NBest=45

# 每页显示候选数
PageSize=9

# libime 数据目录（含 zh_CN.lm 和 sc.dict）
DataDir=/usr/share/libime

# 用户数据目录（自学习历史、用户词库）
UserDataDir=~/.local/share/pinyin-ime

# 模糊音（平翘舌/前后鼻音/n-l 等）
EnableFuzzy=False

# M3 拼写纠错
EnableCorrect=False

# 双拼（双拼输入模式）
EnableShuangpin=False

# 双拼方案（仅 EnableShuangpin=True 时生效）
# 可选：xiaohe(小鹤) / ziranma(自然码) / ms(微软) / ziguang(紫光)
#       abc(智能ABC) / zhongwenzhixing(中文之星) / pinyinjiajia(拼音加加) / gb(国标)
ShuangpinScheme=xiaohe
