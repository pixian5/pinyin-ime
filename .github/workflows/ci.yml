name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libboost-dev \
            libcurl4-openssl-dev \
            libfcitx5config-dev \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            libime-bin \
            libime-data \
            libime-data-language-model \
            libimecore-dev \
            libimepinyin-dev \
            pkg-config \
            python3

      - name: Static checks
        run: bash scripts/ci_static.sh

      - name: Build, test and evaluate
        run: bash scripts/ci_build.sh
