name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Shell / version / packaging checks
        run: bash scripts/ci_static.sh

  # 纯 C++ 单测，不依赖 libime/fcitx5，任何带 g++ 的 runner 都能跑。
  # 目的：让 quick_input_test（600+ 用例）从“本机手工跑”变成“每次提交必跑”。
  unit:
    name: Unit tests (quick_input_test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Build
        run: g++ -std=c++20 -O1 -I cpp cpp/quick_input_test.cpp -o /tmp/quick_input_test
      - name: Run
        run: /tmp/quick_input_test
      - name: Holdout leakage audit (zero overlap with presets/templates)
        run: python3 bench/check_leakage.py
      - name: Eval metrics/gate selftest
        run: python3 bench/eval.py --selftest

  # 真正编译 CLI/addon 并跑 holdout 评测的 job（v0.9.194）。
  # 之前 CI 只有静态检查和不依赖 libime 的单测，编译失败/准确率退化都发现不了。
  build-eval:
    name: Build and eval (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 \
            libimecore-dev libimepinyin-dev libime-data \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            libboost-all-dev libcurl4-openssl-dev
      - name: Build, gates, snapshot and holdout eval
        run: |
          cd repo_workspace 2>/dev/null || true
          bash scripts/ci_build.sh
