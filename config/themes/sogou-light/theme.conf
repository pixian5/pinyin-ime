Right=6
Top=5
Bottom=5

[InputPanel/Background]
# 面板保持直角+1px 描边：带 alpha 的圆角 PNG 在没有 X 合成器时会露出黑角，
# 而绝大多数 fcitx5 用户桌面（GNOME/KDE/xfce+compositing）不保证合成器开启。
# 圆角留给我们完全可控的高亮胶囊（见 [InputPanel/Highlight]），它画在面板之上。
Image=
Color=#ffffff
BorderColor=#d9dee5
BorderWidth=1

[InputPanel/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

